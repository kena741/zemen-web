options:
  logging: CLOUD_LOGGING_ONLY
  dynamicSubstitutions: true

availableSecrets:
  secretManager:
    - versionName: projects/$PROJECT_ID/secrets/FRONTEND_STAGING_ENV/versions/latest
      env: FRONTEND_ENV

steps:
  - id: build-and-push-image
    name: gcr.io/cloud-builders/docker
    env:
      - "DOCKER_BUILDKIT=1"
    secretEnv: ["FRONTEND_ENV"]
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        export DOCKER_BUILDKIT=1
        # ponytail: one dotenv secret → build-args; split per-key if rotation gets painful
        while IFS= read -r line || [[ -n "$$line" ]]; do
          [[ -z "$$line" || "$$line" =~ ^[[:space:]]*# ]] && continue
          key="$${line%%=*}"
          val="$${line#*=}"
          export "$${key}=$${val}"
        done <<< "$$FRONTEND_ENV"
        docker build -f Dockerfile \
          --platform=linux/amd64 \
          --build-arg "NEXT_PUBLIC_SUPABASE_URL=$${NEXT_PUBLIC_SUPABASE_URL:-}" \
          --build-arg "NEXT_PUBLIC_SUPABASE_ANON_KEY=$${NEXT_PUBLIC_SUPABASE_ANON_KEY:-}" \
          --build-arg "SUPABASE_URL=$${SUPABASE_URL:-}" \
          --build-arg "SUPABASE_ANON_KEY=$${SUPABASE_ANON_KEY:-}" \
          --build-arg "NEXT_PUBLIC_EDGE_FUNCTIONS_BASE_URL=$${NEXT_PUBLIC_EDGE_FUNCTIONS_BASE_URL:-}" \
          --build-arg "NEXT_PUBLIC_SITE_URL=$${NEXT_PUBLIC_SITE_URL:-}" \
          --build-arg "NEXT_PUBLIC_GOOGLE_MAPS_API_KEY=$${NEXT_PUBLIC_GOOGLE_MAPS_API_KEY:-}" \
          --build-arg "NEXT_PUBLIC_FIREBASE_API_KEY=$${NEXT_PUBLIC_FIREBASE_API_KEY:-}" \
          --build-arg "NEXT_PUBLIC_FIREBASE_PROJECT_ID=$${NEXT_PUBLIC_FIREBASE_PROJECT_ID:-}" \
          --build-arg "NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID=$${NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID:-}" \
          --build-arg "NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET=$${NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET:-}" \
          -t "${_IMAGE_URI}:${SHORT_SHA}" \
          -t "${_IMAGE_URI}:latest" \
          .
        docker push "${_IMAGE_URI}:${SHORT_SHA}"
        docker push "${_IMAGE_URI}:latest"

  - id: deploy-cloud-run
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    secretEnv: ["FRONTEND_ENV"]
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        while IFS= read -r line || [[ -n "$$line" ]]; do
          [[ -z "$$line" || "$$line" =~ ^[[:space:]]*# ]] && continue
          key="$${line%%=*}"
          val="$${line#*=}"
          export "$${key}=$${val}"
        done <<< "$$FRONTEND_ENV"
        ENV_VARS="NODE_ENV=production,ENVIRONMENT=staging"
        [[ -n "$${SUPABASE_SERVICE_ROLE_KEY:-}" ]] && ENV_VARS="$${ENV_VARS},SUPABASE_SERVICE_ROLE_KEY=$${SUPABASE_SERVICE_ROLE_KEY}"
        [[ -n "$${SUPABASE_URL:-}" ]] && ENV_VARS="$${ENV_VARS},SUPABASE_URL=$${SUPABASE_URL}"
        [[ -n "$${SUPABASE_ANON_KEY:-}" ]] && ENV_VARS="$${ENV_VARS},SUPABASE_ANON_KEY=$${SUPABASE_ANON_KEY}"
        [[ -n "$${EDGE_FUNCTIONS_BASE_URL:-}" ]] && ENV_VARS="$${ENV_VARS},EDGE_FUNCTIONS_BASE_URL=$${EDGE_FUNCTIONS_BASE_URL}"
        [[ -n "$${PASSWORD_RESET_REDIRECT_URL:-}" ]] && ENV_VARS="$${ENV_VARS},PASSWORD_RESET_REDIRECT_URL=$${PASSWORD_RESET_REDIRECT_URL}"

        gcloud run deploy "${_SERVICE}" \
          --image "${_IMAGE_URI}:${SHORT_SHA}" \
          --region "${_DEPLOY_REGION}" \
          --project "${PROJECT_ID}" \
          --platform managed \
          --port 3000 \
          --allow-unauthenticated \
          --quiet \
          --set-env-vars "$${ENV_VARS}"
    waitFor: ["build-and-push-image"]

substitutions:
  _DEPLOY_REGION: europe-west4
  _ARTIFACT_REGION: europe-west4
  _REPOSITORY: zemen-service-frontend
  _IMAGE: frontend-staging
  _SERVICE: zemen-service-frontend-staging
  _IMAGE_URI: ${_ARTIFACT_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/${_IMAGE}

images:
  - "${_IMAGE_URI}:${SHORT_SHA}"
  - "${_IMAGE_URI}:latest"

timeout: 3600s
